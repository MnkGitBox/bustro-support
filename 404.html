<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get Bustro — Singapore's smartest bus companion for live arrivals, alight reminders, and journey tracking.">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
    <title>Get Bustro</title>
    <style>
        /* ---- Bustro design tokens (mirrors index.html) ---- */
        :root {
            color-scheme: light dark;
            --bg: #F2F2F7;
            --label: #1C1C1E;
            --secondary: #6E6E73;
            --green: #85C71F;        /* BsBusGreen */
            --on-green: #152900;     /* dark green text on BsBusGreen fills */
            --accent: #4E7712;       /* SGBus shade for text on light */
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --label: #F2F2F7;
                --secondary: #98989E;
                --accent: #A5DB55;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 1.0625rem;
            line-height: 1.55;
            color: var(--label);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .fallback {
            max-width: 420px;
            margin: 0 auto;
            padding: 48px 24px;
            text-align: center;
        }

        .fallback-otti { width: 128px; height: auto; }

        .fallback h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 14px 0 8px;
        }

        .fallback p {
            color: var(--secondary);
            font-size: 1.0625rem;
            margin: 0 0 28px;
        }

        .appstore {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: var(--green);
            color: var(--on-green);
            font-weight: 600;
            font-size: 1.0625rem;
            padding: 14px 24px;
            border-radius: 14px;
        }

        .appstore:hover { text-decoration: none; filter: brightness(1.04); }

        .secondary {
            margin: 24px 0 0;
            font-size: 0.9375rem;
        }

        .secondary a { font-weight: 600; }
    </style>
</head>
<body>
<main class="fallback">
    <img class="fallback-otti" src="assets/otti-bus-stop.png" srcset="assets/otti-bus-stop@2x.png 2x, assets/otti-bus-stop@3x.png 3x" alt="" width="121" height="83">
    <h1 id="headline">Get Bustro</h1>
    <p id="subline">Live bus arrivals for Singapore.</p>
    <a class="appstore" href="https://apps.apple.com/app/id6740473324">Get Bustro on the App Store</a>
    <p class="secondary"><a href="/index.html">Back to Bustro Help</a></p>
</main>

<script>
  // GitHub Pages serves this one file for every unmatched path, so the specific stop or
  // service can only be recovered in the browser. Anything unrecognised keeps the generic
  // wording already in the markup.
  (function () {
    try {
      var parts = window.location.pathname.split('/').filter(Boolean);
      var headline = null;

      if (parts[0] === 'stop' && parts[1]) {
        headline = 'Bus stop ' + parts[1];
      } else if (parts[0] === 'service' && parts[1]) {
        headline = 'Bus ' + parts[1];
      }

      if (headline) {
        document.getElementById('headline').textContent = headline;
        document.getElementById('subline').textContent =
          'Open this in Bustro for live arrival times.';
      }
    } catch (e) {
      // Generic page is a correct outcome, never a broken one.
    }
  })();
</script>
</body>
</html>
