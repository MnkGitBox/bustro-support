<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live bus arrivals, alight reminders, and journey tracking for Singapore.">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
    <!-- Two files is a GitHub Pages rule, not a choice: `/` is always index.html and every unmatched
         path is always this one. Kept out of search results so index.html is the only indexed copy. -->
    <meta name="robots" content="noindex">
    <title>Bustro — Singapore bus arrivals</title>

    <link rel="stylesheet" href="/assets/landing.css">
</head>
<body>
<main>
    <div class="hero">
        <img class="hero-otti" src="/assets/otti-bus-stop.png" srcset="/assets/otti-bus-stop@2x.png 2x, /assets/otti-bus-stop@3x.png 3x" alt="" width="121" height="83">
        <h1 id="headline">Bustro</h1>
        <p class="tagline" id="tagline">Live bus arrivals, alight reminders, and journey tracking for Singapore.</p>

        <a class="appstore" href="https://apps.apple.com/app/id6740473324">Download on the App Store</a>

        <p class="help">Already have the app? <a href="/help.html">Help &amp; Support</a></p>
        <nav class="langs" aria-label="Help in other languages">
            <a href="/help.ms.html">Bahasa Melayu</a>
            <a href="/help.ta.html">தமிழ்</a>
            <a href="/help.zh-Hans.html">简体中文</a>
        </nav>
    </div>
</main>

<footer>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms &amp; Conditions</a>
</footer>

<script>
  // This file answers every shared /stop/… and /service/… link, so naming the stop is the only
  // signal the visitor gets that their link pointed at something real. Anything unrecognised keeps
  // the generic wording already in the markup.
  (function () {
    try {
      var parts = window.location.pathname.split('/').filter(Boolean);
      var headline = null;

      if (parts[0] === 'stop' && parts[1]) {
        headline = 'Bus stop ' + parts[1];
      } else if (parts[0] === 'service' && parts[1]) {
        headline = 'Bus ' + parts[1];
      }

      if (headline) {
        document.getElementById('headline').textContent = headline;
        document.getElementById('tagline').textContent =
          'Open this in Bustro for live arrival times.';
      }
    } catch (e) {
      // Generic page is a correct outcome, never a broken one.
    }
  })();
</script>
</body>
</html>
